name: Publish dd release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested tag matching runtime version (v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate tag and prepare
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          . ./.dd/core.ps1
          if ($env:RELEASE_TAG -ne "v$($script:DDVersion)") { throw "Tag must match runtime version v$($script:DDVersion)." }
          ./tools/prepare.ps1
          ./tests/verify.ps1
      - name: Package and verify installation
        shell: pwsh
        run: |
          ./tools/package.ps1
          ./tests/ci-exit.ps1
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/dd.zip dist/dd.zip.sha256 --verify-tag --draft --title "dd $RELEASE_TAG" --generate-notes